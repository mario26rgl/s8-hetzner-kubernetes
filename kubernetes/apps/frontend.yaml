apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/mario26rgl/s8-hetzner-kubernetes.git'
    targetRevision: main
    path: kubernetes/service
    helm:
      valuesObject:
        name: frontend
        namespace: frontend
        image: ghcr.io/mario26rgl/front-end@sha256:208ce47ab0e802b061e503b01934393cda0d799934e084106e9a46dffec00eaa
        replicas: 2
        port: 80
        networkPolicy:
          enabled: true
          ingressRules:
            # Traefik ingress controller → frontend
            - fromEndpoints:
                - matchLabels:
                    io.kubernetes.pod.namespace: traefik
              toPorts:
                - ports:
                    - port: "80"
                      protocol: TCP
            # Prometheus → broker HTTP (L7: /metrics endpoint for scraping)
            - fromEndpoints:
              - matchLabels:
                  prometheus: monitoring-prometheus
                  operator.prometheus.io/name: monitoring-prometheus
                  io.kubernetes.pod.namespace: monitoring
              toPorts:
              - ports:
                - port: "80"
                  protocol: TCP
                rules:
                  http:
                  - method: GET
                    path: /metrics
          egressRules:
            # DNS
            - toEndpoints:
                - matchLabels:
                    io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: UDP
                    - port: "53"
                      protocol: TCP
            # → broker HTTP (L7)
            - toEndpoints:
                - matchLabels:
                    app: broker-service
                    io.kubernetes.pod.namespace: broker-service
              toPorts:
                - ports:
                    - port: "80"
                      protocol: TCP
                  rules:
                    http:
                      - method: POST
                        path: /handle
                      - method: POST
                        path: /log
                      - method: POST
                        path: /
              # authentication:
              #   mode: required
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        autoscaling:
          hpa:
            enabled: true
            minReplicas: 1
            maxReplicas: 3
            targetCPUUtilizationPercentage: 80
          vpa:
            enabled: true
            updateMode: Auto
            controlledValues: RequestsAndLimits
            minAllowed:
              cpu: 50m
              memory: 64Mi
            maxAllowed:
              cpu: 500m
              memory: 512Mi
        ingress:
          enabled: true
          hostname: "app.s8-hetzner.online"
          # environment: staging
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
