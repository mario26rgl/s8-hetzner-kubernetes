apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-a-aoa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/mario26rgl/s8-hetzner-kubernetes.git'
    targetRevision: main
    path: kubernetes/vcluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1  # Unlimited retries
      backoff:
        duration: "5s"
        factor: 2
        maxDuration: "3m"