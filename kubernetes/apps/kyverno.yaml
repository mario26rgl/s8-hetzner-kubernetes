apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://kyverno.github.io/kyverno'
    chart: kyverno
    targetRevision: 3.4.4
    helm:
      valuesObject:
        admissionController:
          replicas: 1
        policyReportsCleanup:
          image:
            registry: ghcr.io
            repository: mario26rgl/kubectl
            tag: 'stable'
        webhooksCleanup:
          image:
            registry: ghcr.io
            repository: mario26rgl/kubectl
            tag: 'stable'
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
