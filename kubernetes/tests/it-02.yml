apiVersion: v1
kind: Pod
metadata:
  name: autoscaler-trigger-pod
  namespace: default
  labels:
    app: autoscaler-trigger
spec:
  restartPolicy: Never
  containers:
    - name: autoscaler-trigger
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "1500m"
          memory: "1500Mi"
        limits:
          cpu: "1500m"
          memory: "1500Mi"