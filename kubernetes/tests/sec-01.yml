  apiVersion: v1
  kind: Pod
  metadata:
    name: test-unsigned
    namespace: frontend
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: test
        image: ghcr.io/mario26rgl/front-end:unsigned
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]