# Single source of truth for tenant onboarding.
# Add one object to the tenants array in a PR to bootstrap a new tenant vcluster stack.
tenants:
  - name: tenant-one
    namespace: tenant-one
    project: tenant-one
    chartVersion: "0.33.1"
    sourceRepos:
      - https://github.com/mario26rgl/s8-hetzner-kubernetes.git
    vclusterOverrides: |
      controlPlane:
        backingStore:
          etcd:
            deploy:
              statefulSet:
                persistence:
                  volumeClaim:
                    size: 1Gi
                    storageClass: local-path
        statefulSet:
          persistence:
            volumeClaim:
              storageClass: local-path
          scheduling:
            nodeSelector:
              topology.s8.io/location: aws-external
            tolerations:
              - key: topology.s8.io/location
                operator: Equal
                value: aws-external
                effect: NoSchedule
              - key: node.cloudprovider.kubernetes.io/uninitialized
                operator: Equal
                value: 'true'
                effect: NoSchedule
        coredns:
          deployment:
            nodeSelector:
              topology.s8.io/location: aws-external
            tolerations:
              - key: topology.s8.io/location
                operator: Equal
                value: aws-external
                effect: NoSchedule
              - key: node.cloudprovider.kubernetes.io/uninitialized
                operator: Equal
                value: 'true'
                effect: NoSchedule
      sync:
        toHost:
          pods:
            enforceTolerations:
              - "topology.s8.io/location=aws-external:NoSchedule"
              - "node.cloudprovider.kubernetes.io/uninitialized=true:NoSchedule"

    argocdUser:
      username: tenant-one-admin
      roleName: tenant-admin
      passwordHashSecretRef:
        key: /argocd/tenants/tenant-one/user
        property: passwordHash
      passwordMtimeSecretRef:
        key: /argocd/tenants/tenant-one/user
        property: passwordMtime
    repoCredentials:
      enabled: true
      authType: basic
      name: tenant-one-repo
      secretRef:
        key: /argocd/tenants/tenant-one/repo
        urlProperty: url
        usernameProperty: username
        passwordProperty: password


