name: database
namespace: database
image: postgres:14.2
replicas: 1
servicePort: 5432
containerPort: 5432
extraServicePorts: []
env: {}
resources: {}
podSecurityContext:
  fsGroup: 10999
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10999
  runAsGroup: 10999
  capabilities:
    drop:
      - ALL
persistence:
  enabled: true
  size: 5Gi
  mountPath: /var/lib/data
bootstrap:
  enabled: true
  sqlPath: /bootstrap/users.sql
  statePath: /var/lib/data/.users-bootstrap.sha256
