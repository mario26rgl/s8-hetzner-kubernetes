apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.name }}-quota
  namespace: {{ .Values.namespace }}
spec:
  hard:
    persistentvolumeclaims: "0"
    pods: "4"
    services: "1"
    services.loadbalancers: "0"
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "4"
    limits.memory: "2Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Values.name }}-limit-range
  namespace: {{ .Values.namespace }}
spec:
  limits:
  - max: 
      cpu: 500m
      memory: 512Mi
    min:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container