{{- if .Values.autoscaling.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
  updatePolicy:
    updateMode: {{ .Values.autoscaling.vpa.updateMode }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ .Values.name }}
        controlledValues: {{ .Values.autoscaling.vpa.controlledValues }}
        minAllowed:
{{ toYaml .Values.autoscaling.vpa.minAllowed | nindent 10 }}
        maxAllowed:
{{ toYaml .Values.autoscaling.vpa.maxAllowed | nindent 10 }}
{{- end }}