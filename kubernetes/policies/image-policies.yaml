---
# Restrict images to ghcr.io/mario26rgl/ in namespaces labelled app=true
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registry
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: allow-only-ghcr
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  app: "true"
      validate:
        message: "Images must come from ghcr.io/mario26rgl/"
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              image: "ghcr.io/mario26rgl/*"
---
# Disallow latest tag in namespaces labelled app=true
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  app: "true"
      validate:
        message: "Images must not use the 'latest' tag. Use a digest or specific version tag."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: NotContains
                    value: ":"
---
# Verify Cosign signature for ghcr.io/mario26rgl/ images
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
spec:
  validationFailureAction: Enforce
  background: false  # signature verification must be at admission time
  rules:
    - name: check-cosign-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels:
                  app: "true"
      verifyImages:
        - imageReferences:
            - "ghcr.io/mario26rgl/*"
          skipImageReferences:
            - "ghcr.io/mario26rgl/broker-service:*"  # remove once broker is signed
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEDsABb+iG9uBup3dpY8ZPZkapMP4V
                      uSmpBTpfBWFI0c9uf9Hak6UTv3OaAhyPGGhnYCR50xl/Xl+MnSUQIjx08w==
                      -----END PUBLIC KEY-----
