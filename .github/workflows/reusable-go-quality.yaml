name: Reusable Go Quality Gate

on:
  workflow_call:
    inputs:
      service-dir:
        description: "Path to the service directory (e.g. code/broker-service)"
        required: true
        type: string
      go-version:
        description: "Go toolchain version"
        required: false
        type: string
        default: "stable"

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.service-dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.service-dir }}/go.sum

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          working-directory: ${{ inputs.service-dir }}
          install-go: false

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  sbom-scan:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.service-dir }}
          artifact-name: sbom-${{ inputs.service-name }}.spdx.json
          format: spdx-json
          output-file: /tmp/sbom-${{ inputs.service-name }}.spdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v6
        with:
          sbom: /tmp/sbom-${{ inputs.service-name }}.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
