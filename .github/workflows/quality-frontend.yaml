name: Quality Gate — front-end

on:
  pull_request:
    branches: [main]
    paths:
      - code/front-end/**
      - .github/workflows/quality-frontend.yaml
      - .github/workflows/reusable-go-quality.yaml

jobs:
  quality:
    uses: ./.github/workflows/reusable-go-quality.yaml
    with:
      service-dir: code/front-end
      go-version: "1.18"
