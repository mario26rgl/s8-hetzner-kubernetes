name: Quality Gate — listener-service

on:
  pull_request:
    branches: [main]
    paths:
      - code/listener-service/**
      - .github/workflows/quality-listener-service.yaml
      - .github/workflows/reusable-go-quality.yaml

jobs:
  quality:
    uses: ./.github/workflows/reusable-go-quality.yaml
    with:
      service-dir: code/listener-service
