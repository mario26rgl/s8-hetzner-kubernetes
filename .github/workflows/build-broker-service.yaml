name: Build and Push Broker Service Container

on:
  push:
    branches: [ main ]
    paths:
      - code/broker-service/**
      - .github/workflows/build-broker-service.yaml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: broker-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build broker binary
        run: |
          cd code/broker-service
          CGO_ENABLED=0 GOOS=linux go build -o brokerApp ./cmd/api

      - name: Build and push Broker Service Container
        uses: macbre/push-to-ghcr@master
        with:
          image_name: mario26rgl/${{ env.IMAGE_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: ./code/broker-service/broker.dockerfile
          context: ./code/broker-service
          image_tag: ${{ github.sha }}

      - name: Update Helm chart with new Docker image tag
        run: |
          sed -i "s|image: ghcr.io/mario26rgl/broker-service:.*|image: ghcr.io/mario26rgl/broker-service:${{ github.sha }}|" \
            kubernetes/apps/broker.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/broker.yaml
          git commit -m "chore: update broker-service image tag to ${{ github.sha }}"
          git push origin main
