name: Quality Gate — broker-service

on:
  pull_request:
    branches: [main]
    paths:
      - code/broker-service/**
      - .github/workflows/quality-broker-service.yaml
      - .github/workflows/reusable-go-quality.yaml

jobs:
  quality:
    uses: ./.github/workflows/reusable-go-quality.yaml
    with:
      service-dir: code/broker-service
