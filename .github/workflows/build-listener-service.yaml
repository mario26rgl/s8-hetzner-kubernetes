name: Build and Push Listener Service Container

on:
  push:
    branches: [ main ]
    paths:
      - code/listener-service/**
      - .github/workflows/build-listener-service.yaml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: listener-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build listener binary
        run: |
          cd code/listener-service
          CGO_ENABLED=0 GOOS=linux go build -o listenerApp .

      - name: Build and push Listener Service Container
        uses: macbre/push-to-ghcr@master
        with:
          image_name: mario26rgl/${{ env.IMAGE_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: ./code/listener-service/listener.dockerfile
          context: ./code/listener-service
          image_tag: ${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/mario26rgl/listener-service:${{ github.sha }} | cut -d@ -f2)
          echo "value=$DIGEST" >> $GITHUB_OUTPUT

      - name: Sign the image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            --yes \
            ghcr.io/mario26rgl/listener-service@${{ steps.digest.outputs.value }}

  update-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    concurrency:
      group: update-manifest
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest main (pick up other workflows' commits)
        run: git pull --rebase origin main

      - name: Update Helm chart with new Docker image tag
        run: |
          sed -i "s|image: ghcr.io/mario26rgl/listener-service:.*|image: ghcr.io/mario26rgl/listener-service@${{ needs.build-and-push.outputs.digest }}|" \
            kubernetes/apps/listener.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/listener.yaml
          git commit -m "chore: update listener-service image digest to ${{ github.sha }}"
          git push origin main
